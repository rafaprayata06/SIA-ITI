
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sia_iti_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sia-network

  nginx:
    image: nginx:alpine
    container_name: sia_iti_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sia-network

  db:
    image: postgres:17
    container_name: sia_iti_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-sia-iti}"
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD harus diatur di file .env}"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sia-network

volumes:
  pgdata:
  vendor:

networks:
  sia-network:
    driver: bridge
